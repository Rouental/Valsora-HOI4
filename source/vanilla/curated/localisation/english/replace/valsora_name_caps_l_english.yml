 SOV_GREAT_RED_MENACE_EVENT_DESC_1_COMMUNIST:0 "[SOV.GetNameDefCap] is, and has been, the greatest threat to the stability of Europe since its inception two decades ago"
 wtt_japan.127.desc:0 "[From.GetNameDefCap] has accepted our peace offer, and has ceased hostilities in return for our continental possessions."
 wtt_japan.128.desc:0 "[From.GetNameDefCap] has rejected our peace offer, vowing to pursue the war until they obtain an unconditional surrender."
 AUS_political_events.23.desc:0 "[FROM.GetNameDefCap] has responded to our request for aid with a request of their own. Since the time when this Treaty was put upon us we have strived to retake Alto Adige and Trentino for ourselves, as they do rightfully belong to us. [FROM.GetNameDefCap] regards these lands as theirs, and if they are to guarantee our independence they want us to renounce these claims once and for all."
