 AUS_join_the_research_program_tt:0 "§Y[ROOT.GetNameDefCap]§!, and every country in a faction with us, will join a §YTech Sharing Group§!"
 BEL_belgian_air_force_desc:0 "[ROOT.GetNameDefCap] was an early adopter of air power, developing a force during the last war which gave a very good account of themselves. Unfortunately, budgetary constraints have held innovation back since. As tensions rise, we must ensure that our air deterrent remains strong."
 BEL_polish_licences_desc:0 "[POL.GetNameDefCap] has reached out about providing some of their aircraft designs under license, and they can be made available to us for far under market rates."
 GER_secure_spain_desc:0 "[SPR.GetNameDefCap] has proven a most volatile country. As they struggle with their administration, perhaps we should offer them a helping hand? At this point, surely being our puppet regime must be preferable to the chaos they are used to?"
