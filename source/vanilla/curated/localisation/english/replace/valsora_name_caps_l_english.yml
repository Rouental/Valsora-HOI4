 JUNO_guay_events.10.t:0 "[FROM.GetNameDefCap] Decides to Continue the Assault"
 ARG_argentina_for_all_idea_desc:0 "Our great nation has such a wide array of people living within its borders and for a long time, it has been nigh on impossible to unite our population under one banner. It is time we changed our approach. [ARG.GetNameDefCap] is a country that should be accessible and accepting of all who call it home."
 WTT_border_conflict_escalation_warning_defender_desc:0 "§WMaintain divisions in §H[From.From.GetName]§!\n§H[From.GetNameDefCap]§! can escalate to a §HBorder Conflict§!§!."
