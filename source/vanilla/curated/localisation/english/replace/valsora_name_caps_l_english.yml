l_english:
 # the game's lines with a country's name opening a sentence, capitalised (scripts/vanilla_sync.py, name_caps)
 SPR_has_eliminated_guerrillas_tt:0 "[SPR.GetNameDefCap] has eliminated all guerrillas in its territory"
 SEA_china_warlords.4.t:0 "[FROM.GetNameDefCap] Demands Full Annexation"
 SEA_PHI_political_events.13.desc:0 "[PHI.GetNameDefCap] Communist Party has repeatedly spurned our representatives, and threatened to break all relations with us.\n\nSenior military officials have presented a military plan to the desk of [Root.GetLeader]. Proponents of the plan argue that a communist Philippines is a threat to our security and we must intervene to stop the spread of communism."
 PHI_traitors_back_home_desc:0 "[USA.GetNameDefCap] has become weak and fearful. No-one there wants to do what must be done, so it is up to us to purge the ranks of politicians and cowards, and reclaim the Shining City Upon A Hill for the American people."
 INS_union_events.8.desc:0 "It is clear to the world that the war is not looking in our favor. [HOL.GetNameDefCap] has fallen and their base of operations has moved to the east. [HOL.GetAdjective] leaders have sent us a proposal to form a joint union state led by Queen Wilhelmina in order to guarantee as much cooperation as possible. While it seems nobody is particularly happy with the proposal, it may be our key for survival."
 taog_news.2.desc:0 "[INS.GetAdjective] revolutionary [INS.GetLeader] held a speech in Java today declaring the independence of the newly formed Republic of Indonesia. [HOL.GetNameDefCap] does not recognize the sovereignty of this newfound republic, but Republican militias already hold de-facto control over certain territory."
 INS_limited_war_events.5.t:0 "[FROM.GetNameDefCap] Calls for Our Destruction"
 ABDA_events.1.desc:0 "[FROM.GetNameDefCap] has established a joint supreme command for the Pacific theatre and has extended an invitation for us to join. The initiative — known as ABDACOM — seeks to pool the naval, air, and ground forces of allied nations operating in the region under a unified command structure. Membership would mean closer coordination with [FROM.GetNameDef] and the other partners already committed to the effort. We must decide whether to accept."
 ABDA_events.2.desc:0 "[FROM.GetNameDefCap] has accepted our invitation to join the ABDACOM Supreme Command. Their forces will now operate under the joint command structure, strengthening our position in the Pacific theatre."
 ABDA_events.3.desc:0 "[FROM.GetNameDefCap] has declined our invitation to join the ABDACOM Supreme Command. Their forces will not be committed to the joint effort at this time, though the door may yet remain open."
 ABDA_events.5.desc:0 "[FROM.GetNameDefCap] has extended an invitation for us to join the American-British-Dutch-Australian Command. ABDACOM has already established itself as the supreme coordinating authority for Allied forces in the Pacific theatre, bringing together the navies and armies of the major Allied powers under one command. Membership would bring our forces into this unified structure, with access to shared intelligence, coordinated doctrine, and the full weight of Allied support. We must decide."
 AAT_nordic_cooperation.1.t:0 "[FROM.GetNameDefCap] has crossed the line!"
 AAT_Sweden.11.t:0 "[GER.GetNameDefCap] workers seize control of Landsverk factories"
 AAT_Sweden.16.t:0 "[SWE.GetNameDefCap] threatens hostilities over Narvik"
 AAT_Sweden_flashpoints.62.desc:0 "[SWE.GetNameDefCap] has pushed recent tensions to a new high today by issuing a trade embargo against [GER.GetNameDef]. This decision will significantly impact our ability to produce iron for the arms industry. "
 AAT_Sweden_flashpoints.64.desc:0 "[SWE.GetNameDefCap] has firmly rejected our ultimatum. They have stated that any attack against them will not improve their access to [SWE.GetAdjective] ore reserves as they will destroy the mine shafts long before our military can occupy them."
 FIN_children_destination_sweden:0 "[SWE.GetNameDefCap]"
 FIN_children_destination_norway:0 "[NOR.GetNameDefCap]"
 FIN_children_destination_denmark:0 "[DEN.GetNameDefCap]"
 FIN_children_destination_iceland:0 "[ICE.GetNameDefCap]"
 AAT_finland_diplomacy.25.t:0 "[FROM.GetNameDefCap] Rejects our Request for Protection"
 AAT_finland_continuation_war.09.t:0 "[FROM.GetNameDefCap] Rejects our Offer of Peace"
 FIN_subsidized_national_industrialization_desc:0 "[SOU.GetNameDefCap] has made great strides in the mass mobilization of the nation's productive forces through industrialization. Perhaps we should request aid from their experts in rolling out a similar program in Finland."
 FIN_prepare_a_military_coup_desc:0 "[FIN.GetNameDefCap] needs strong, decisive leadership that is capable of making the tough decisions in a crisis. The only people currently capable of that are the military. Rather than waiting for the nation to unravel under democrats and socialists, we shall lay the groundwork for a military coup."
 SWE_establish_nordland_tt:0 "§Y[SWE.GetNameDefCap]§! will be known as §Y$SWE_establish_nordland$§!"
 SWE_norma_projektilfabrik_tt:0 "Add §G1§! extra §YMilitary Factory§! if completed while §Y[NOR.GetNameDef]§!:\nHas War with a major country\nHas more than 0% surrender progress\n§Y[SWE.GetNameDefCap]§!: Does not have war with §YNorway§!"
 ICE_declare_absolute_neutrality_tt:0 "§Y[ROOT.GetNameDefCap]§! will become independent if §Y[ROOT.OVERLORD.GetNameDef]§! is declared war upon"
 otto-man_tt:0 "Controls §Y[88.GetName]§!, §Y[89.GetName]§!, §Y[91.GetName]§! and all the starting states of:\n§Y[AUS.GetNameDefCap]\n[HUN.GetNameDefCap]\n[CZE.GetNameDefCap]\n[CRO.GetNameDefCap]\n[LBV.GetNameDefCap]\n[ROM.GetNameDefCap]\n[BUL.GetNameDefCap]\n[GRE.GetNameDefCap]\n[TUR.GetNameDefCap]§!"
 BBA_italo_ethiopian_war_events.510.t:0 "[ITA.GetNameDefCap] Undermines Ethiopian Authority"
 BBA_ethiopia_exile_events.23.desc:0 "In an offer of goodwill, and in recognition of [ROOT.GetLeader] as the rightful ruler of [ROOT.GetNameDef], [FROM.GetLeader] has given [ROOT.GetLeader] the island of [?ETH.japanese_island.GetName] as a staging area for reclaiming [ROOT.GetName].\n\n [FROM.GetNameDefCap] will assist [ROOT.GetName] in the reconquest of the lost territory. In return for these favors, [ROOT.GetLeader] has sworn fealty to [FROM.GetLeader], tying the two countries closer together in their struggle against European imperialism."
 ETH_ethiopia_italian_puppet_tt:0 "\n§Y[ETH.GetNameDefCap]§! will become a subject of §Y[ITA.GetNameDef]§!"
 BBA_ethiopia_communist_events.58.t:0 "[ETH.GetNameDefCap]–[JAP.GetName] Relations Ruined"
 BBA_italy_interaction_events.3.t:0 "[SWI.GetNameDefCap] Stands Defiant!"
 BBA_italy_interaction_events.18.desc:0 "[ITA.GetNameDefCap] has approached us with an enticing offer. They offer us ownership of Rhodes and the Dodecanese islands in exchange for an alliance with them. This is an offer that almost seems too good to be true, but isn't. What shall we do?"
 BBA_italy_interaction_events.19.t:0 "[GRE.GetNameDefCap] Accepts our Offer"
 BBA_italy_interaction_events.20.t:0 "[GRE.GetNameDefCap] has Ungratefully Rejected our Offer"
 BBA_italy_interaction_events.21.desc:0 "[ITA.GetNameDefCap] has approached us with an enticing offer. They offer us ownership of Rhodes and the Dodecanese islands in exchange for an alliance with them. This is an offer that almost seems too good to be true, but isn't. What shall we do?"
 BBA_italy_interaction_events.22.t:0 "[TUR.GetNameDefCap] Accepts our Offer"
 BBA_italy_interaction_events.23.t:0 "[TUR.GetNameDefCap] has Ungratefully Rejected our Offer"
 BBA_italy_interaction_events.26.t:0 "[ITA.GetNameDefCap] Backs Down"
 BBA_switzerland_fascist.3.desc:0 "[FROM.GetNameDefCap] is claiming that they have a claim on [848.GetName] after an election in 1919 where the majority of the region chose to join what at the time was the Swiss Confederation. As much as they've abandoned Democracy and the vote happened decades ago, giving them responsibility over this state could free up the resources we spend holding the territory, and could work as a test of [FROM.GetName]'s capabilities and more importantly, loyalties."
 BBA_swiss_expansion.5.t:0 "[FROM.GetNameDefCap] ignores calls for a referendum!"
 GRE_bribe_french_trade_unions_to_pressure_government_into_investment_desc:0 "[FROM.GetNameDefCap] has been enslaved by their trade unions for quite a long time, so by helping the trade unions to foment instability we better our bargaining position by using blackmail."
 bftb_greece.8.desc:0 "We have just received an interesting proposition from [FROM.GetNameDef], who evidently seek to redraw the borders of [TUR.GetNameDef]. [FROM.GetNameDefCap] seek to hold a discussion among Europe's victorious powers from the Great War to readdress the treaties of Sevres and Lausanne which we attempted to impose on [TUR.GetNameDef]. \n\nOfficials from [FROM.GetNameDef] assure our officials that we stand to gain material gains from a vanquished [TUR.GetNameDef], and that the obliteration of [TUR.GetNameDef] is not the wish of the [FROM.GetAdjective] government. Instead, figures from [FROM.GetNameDef] are insisting on referring to this convention as a simple matter over the reorganization of borders rather than the realization of revanchist dreams."
 bftb_greece.33.t:0 "[FROM.GetNameDefCap] Submits!"
 bftb_greece.34.desc:0 "Curse us for fools! [SOV.GetNameDefCap] have abused their freedom of movement throughout our borders to establish a rival communist government close to their own country and clearly intend to conquer our whole nation in its name! We should have known from the start this is how it was going to go down; some members our own government have even fled to join the rival government in the north, claiming our situation is hopeless. Perhaps simply surrendering would spare our nation fewer deaths in the days to come..."
 bftb_turkey.4.t:0 "[TUR.GetNameDefCap] Seizes Control Over the Bosporus!"
 bftb_turkey.55.desc:0 "In 1923, the newly founded Republic of Turkey ratified and approved a piece of legislation allowing us to develop [FROM.GetNameDef]'s oilfields and railways. The United States Senate, taking into consideration the toll the Great Depression was taking on the American economy, decided not to ratify the treaty. [FROM.GetNameDefCap] has reversed their annulment of the treaty, and asked us once again to fulfill the stipulations of the concession that was originally drafted up by us. \n\nIt cannot be denied that economically we are in a much safer place than we were in 1923, and it would be a great boon to have [FROM.GetNameDef] ideologically and militarily aligned to us. However, war looms over the entire globe and even from our position of strength we must be economical about how we devote our resources. Having oil available in [FROM.GetNameDef] might in the future be quite valuable as leverage against [SOV.GetNameDef], but in the short-term we must also consider the possibility of how that unearthed petroleum might fall into the hands of our enemies. It might be wise to leverage the [FROM.GetAdjective] need for our help to further our own aims. [FROM.GetNameDefCap] contains a lot of chromium, while our nation unfortunately does not. The choice is ours."
 bftb_turkey.61.t:0 "[FROM.GetNameDefCap] Cedes Sovereignty of Hatay to Us"
 bftb_turkey.62.a:0 "[FROM.GetNameDefCap] must perish."
 bftb_bulgaria_equipment_purchases.5.t:0 "[BUL.GetNameDefCap] Seeks to Purchase [ROOT.GetAdjective] Vessels"
 bftb_bulgaria_equipment_purchases.6.a_tt:0 "[FROM.GetNameDefCap] will build §Y3 Submarines§! for the [ROOT.GetAdjective] Navy."
 bftb_bulgaria_equipment_purchases.6.b_tt:0 "[FROM.GetNameDefCap] will build §Y2 Destroyers§! for the [ROOT.GetAdjective] Navy."
 bftb_bulgaria_equipment_purchases.6.c_tt:0 "[FROM.GetNameDefCap] will build §Ya Light Cruiser§! for the [ROOT.GetAdjective] Navy."
 bftb_bulgaria_balkan_federation.5.desc:0 "The [BUL.GetAdjective] government has sent us a proposal to carry out the unification of the Balkans under a centralized government, with the aim of improving the understanding and cooperation between the different peoples of the Balkans. According to [BUL.GetLeader], this is the last great step of the Balkan Federation that will allow us to leave behind the conflicts of the past and guarantee unity and peace between our nations permanently. \n[BUL.GetNameDefCap] awaits the response of the [ROOT.GetAdjective] government to proceed with the consequent unification of our nations."
 bftb_bulgaria_balkan_federation.12.b:0 "[ROOT.GetNameDefCap] will not give in to [BUL.GetAdjective] pressure!"
 bftb_bulgaria_fate_of_the_balkans.10.a:0 "[BUL.GetNameDefCap] shall pay for this!"
 GRE_open_foreign_subsidized_factories_tt:0 "One §YMilitary Factory§! and one §YCivilian Factory§! will be added for each of the following countries that has an §Yopinion§! of §YGreece§! greater than §G80§!: \n§Y[FRA.GetNameDefCap]§!, §Y[ENG.GetNameDef]§!, §Y[GER.GetNameDef]§!, and §Y[SOV.GetNameDef]§!."
 TUR_aligning_bulgaria_desc:0 "[BUL.GetNameDefCap], the only one of us all from the Central Powers to survive with their sovereignty and way of life intact, and what have they done with that? Nothing. They are cowards! We shall see just how cowardly they are with us breathing down their necks and keeping them to task."
 TUR_brace_against_the_red_menace_communism_desc:0 "To the north lies the perfidious threat of communism and its chief sponsor in the world. [SOV.GetNameDefCap] is a pox on this world, and the Balkan Entente will be doing humankind a favor by dismantling the [SOV.GetAdjective] hegemony."
 BUL_approach_the_united_kingdom_desc:0 "[ROOT.GetNameDefCap] needs the protection of the great democratic powers in Europe if it is to prevail in these uncertain times. We must meet with the [ENG.GetAdjective] government to negotiate a co-operative pact between our countries."
 BUL_appeal_to_european_capitalists_desc:0 "[ROOT.GetNameDefCap] needs a new injection of capital to stimulate the development of its national industry and to renegotiate its debt with the large multinationals that have already invested in the country."
 TUR_turkish_bolshevism_desc:0 "Kemalism served its purpose and now will be consigned to the history books... well, some illegal history books at any rate. [TUR.GetNameDefCap] is now modelled upon Vladimir Lenin's revolution rather than the revisionist reactionary Mustafa Kemal Atatürk and his quashed movement."
 TUR_cannot_form_kurdish_collaboration_government_tt:0 "§Y[TUR.GetNameDefCap]§! can never form a Kurdish Collaboration Government."
 TUR_has_a_prime_minister_tt:0 "§Y[TUR.GetNameDefCap]§! has a Prime Minister."
 BUL_ferdinands_puppet_desc:0 "[ROOT.GetNameDefCap] has been subjugated by Tsar Ferdinand I of [BUL.GetNameDef], who exercises a great influence over the [ROOT.GetAdjective] government, keeping the country's politics, economy and industry under his full control."
 BUL_the_bulgarian_threat_desc:0 "[BUL.GetNameDefCap]'s ambitious aspirations in the Balkans pose a significant threat to the integrity of [ROOT.GetNameDef] and the freedom of the [ROOT.GetAdjective] people."
 DOD_hungary.91.desc:0 "\n[FROM.GetNameDefCap] has agreed to cede the Vojvodina to us. Our forces have taken full control."
 finland.9.d:0 "The negotiations initiated with [From.GetNameDef] has broken down. It was obviously a ruse to waste our time while the [From.GetAdjective] army positioned for yet another assault on [Root.GetAdjective] territory.\n\n[Root.GetNameDefCap] will stand tall and fight till the bitter end."
 news.1.d:0 "Japanese and Chinese forces have skirmished inconclusively over the strategic Marco Polo Bridge located just southwest of Beijing. \n\n[CHI.GetNameDefCap] has rejected [JAP.GetNameDef]'s demands for an apology and territorial concessions, claiming instead that the 'breaking point' of Japanese aggression has been reached. \n\nDiplomats fear that the volatile situation could result in war at any time."
 news.2.d:0 "Japanese and Chinese forces have skirmished inconclusively over the strategic Marco Polo Bridge located just southwest of Beijing. \n\n[CHI.GetNameDefCap] has accepted full responsibility for the incident, forwarding an apology to [JAP.GetNameDef] as well as agreeing to extensive territorial concessions. This has surprised many experts, who had predicted that the border tensions would erupt into a full-blown war. \n\nDoes this mean lasting peace in Asia?"
 news.13.d:0 "After much debate, the government of [FIN.GetNameDef] has decided to accept Soviet demands for border adjustments in the region of Karelia. \n\n[SOV.GetNameDefCap] has cited the need to create a buffer zone to improve the security of Leningrad, located only 30 kilometers from the now former Finnish border. \n\nMany observers had feared that a full-scale Soviet invasion of Finland was imminent, but this diplomatic solution should lay those fears to rest."
 news.17.d:0 "Negotiations between [HUN.GetNameDef] and [ROM.GetNameDef] regarding a territorial dispute have broken down at Vienna. \n\n[GER.GetNameDefCap] acted as arbiter, but when they decided to return Northern Transylvania to [HUN.GetNameDef], [ROM.GetNameDef] rejected the decision. The Romanian government promptly ordered their delegation to return to Bucharest. \n\nIt would appear that [GER.GetNameDef] does not yet wield the diplomatic influence they imagined they did."
 news.18.d:0 "Negotiations between [HUN.GetNameDef] and [ROM.GetNameDef] regarding a territorial dispute have broken down at Vienna. \n\n[GER.GetNameDefCap] acted as arbiter, but when they decided to return Northern Transylvania to [HUN.GetNameDef], [ROM.GetNameDef] rejected the decision. The Romanian government promptly ordered their delegation to return to Bucharest. \n\nIt would appear that [GER.GetNameDef] does not yet wield the diplomatic influence they imagined they did."
 news.22.d:0 "An ultimatum has been delivered to the Albanian government by Italian diplomats, demanding that they submit to complete military occupation. \n\n[ALB.GetLeader] has abdicated after realizing the futility of resistance, and Albania will now be ruled in a personal union under King Vittorio Emanuele III.\n\n[ITA.GetNameDefCap] looks to the Balkans..."
 news.70.d:0 "Since the rise to power of the [baltic_annexation.GetRulingParty], [baltic_annexation.GetNameDef] has been working towards closer relations with [SOV.GetNameDef].\n\nAlthough [baltic_annexation.GetLeader] remains in office, ministers are chosen for their allegiance to [SOV.GetNameDef], and a large part of the nation's sovereignty has been surrendered. Soviet officials state that [baltic_annexation.GetName] is merely seeking protection as a response to Europe becoming increasingly unsafe for smaller nations.\n\n[SOV.GetNameDefCap] also reiterated that they were willing to extend such "protection" to any state that felt threatened by neighboring countries."
 news.154.d:0 "The non-aggression pact between Germany and the [SOV.GetNameDef], a surprising development to begin with, has now less surprisingly fallen apart. [SOV.GetNameDefCap] has attacked, breaking the pact and vowing to crush the German regime and once again put the expansionist state in their place.\n\nGerman leaders may have been planning an attack themselves, but the world will never know. They are now rapidly mobilizing to deal with the new threat."
 news.202.d:0 "Following months of increasingly aggressive rhetoric, the deteriorating relationship between [GER.GetNameDef] and [POL.GetNameDef] had a reversal of fortunes this evening, with a diplomatic deal intended to settle the Danzig dispute.\n\n[POL.GetNameDefCap] will incorporate the German-controlled Slovakia as a Polish substate, and will in exchange cede the region of Danzig. The status of the Free City of Danzig was quickly settled, and it will soon be fully reincorporated into the German state.\n\nWhile the matter seems to have been settled peacefully, the victors of the Great War are sure to have objections."
 news.204.d:0 "Considering the demands, it seemed inevitable. \n\n[From.GetNameDefCap] would be forced to cede Danzig to Germany, and a Polish plenipotentiary would be sent to Berlin to negotiate further terms. [From.GetLeader] pointed to [GER.GetNameDef]'s recent actions when stating that it was obvious Germany would not be satisfied with Danzig alone.\n\nGerman and Polish forces are prepared for war, and reports are already coming in of clashes on the border. Once again there is war in Europe."
 news.217.d:0 "\n\nIn delivering an ultimatum to the [TUR.GetAdjective] government, [GER.GetNameDef] has created a new enemy for itself. Rather than cave to the demands from [GER.GetAdjective] diplomats as [GER.GetLeader] expected, [TUR.GetNameDef] has agreed to a defensive alliance with [ENG.GetNameDef].\n\n[ENG.GetNameDefCap] and her allies prepare to defend [TUR.GetNameDef] in case [GER.GetNameDef] acts on its ultimatum."
 news.228.d:0 "\n[ENG.GetNameDefCap] is not alone in seeing the threat rising in Central Europe.\n\nWith their status as an independent nation guaranteed by the now-challenged Treaty of Versailles, or with fascist powers in their aggressive rhetoric claiming right to their territory, several states have seen the need to lead a pro-[ENG.GetAdjective] policy. \n[ENG.GetNameDefCap] has responded to this development by redoubling their diplomatic efforts in the region."
 news.239.d:0 "Seeing their countries as "natural allies in the spread of the revolution," [AST.GetLeader] and [SOV.GetLeader] have signed a treaty that sees [AST.GetNameDef] accede as one of the primary members of the [SOV.GetFactionName].\n[AST.GetNameDefCap] has been declared a shining example of a worker's state, by and for the people, rather than the colonial overlords of Europe.\n\nWith the recent developments in [AST.GetAdjective] politics, some might say this move was inevitable. Nevertheless it is seen as a great cause for worry among those precise "colonial overlords of Europe," and any who are opposed to the unfettered grasp of communists and their World Revolution."
 news.242.d:0 "\n[ENG.GetNameDefCap] military doctrine has long struggled with the issue of defense in Southeast Asia. Now they are hoping their problems are at an end, as [AST.GetNameDef] assumes responsibility for the defense of Singapore and Borneo, to counter hostile military activity in the region.\n\nThis transfer of power includes, at least for the time being, the civilian administration of the colonial regions, in order to allow [AST.GetNameDef] any measures required to keep their continent safe from overseas attack. The political implications of this move for [ENG.GetNameDef], [AST.GetNameDef] and [MAL.GetNameDef] are as of yet uncertain."
 country_capitulated.0.d_positive_collab_diff_ideology:0 "\n[Root.GetNameDefCap] has announced its total surrender to [From.From.GetNameDef]. The [From.From.GetAdjective] forces along with a number of independent [Root.GetAdjective] [From.From.GetRulingIdeology] supporters have forced [Root.GetLeader] and his government into exile as a new government has been established to rule [Root.GetNameDef] in cooperation with [From.From.GetNameDef]. [From.From.GetLeader] has remarked that this mutual agreement will bring a new age of prosperity and cooperation to [Root.GetNameDef].\n[Root.GetLeader] responded by stating that even in exile, he shall continue to fight for [Root.GetNameDef] and support all resistance efforts in his homeland."
 country_capitulated.0.d_positive_collab_invaded_same_ideology:0 "\n[Root.GetNameDefCap] has announced its total surrender to [From.From.GetNameDef]. A number of [Root.GetAdjective] citizens dissatisfied with the brand of [From.From.GetRulingIdeologyNoun] brought to [Root.GetNameDef] by [Root.GetLeader] joined the [From.From.GetAdjective] soldiers in removing him from power and forming a new government under the guidance of [From.From.GetNameDef]. [From.From.GetLeader] has remarked that this mutual agreement will bring a new age of prosperity and cooperation to [From.From.GetNameDef]\n[Root.GetLeader] responded by stating that [From.From.GetLeader] is no true [From.From.GetRulingIdeology] and even in exile, he shall continue to fight for [Root.GetNameDef] and support all resistance efforts in his homeland."
 country_capitulated.0.d_negative_collab_diff_ideology:0 "\n[Root.GetNameDefCap] has announced its total surrender to [From.From.GetNameDef]. It's evident that the [Root.GetAdjective] government's leniency towards domestic [From.From.GetRulingIdeology] sympathisers was a contributing factor to the fall of [Root.GetName] as [Root.GetFascistLeader] has been swept into office to rule the country in the name of [From.From.GetLeader]'s regime.\n[Root.GetLeader] claims that this is not the end of [Root.GetAdjective] sovereignty, and that the government shall support all resistance efforts even while exiled from their homeland."
 wtt_xian_incident_warning_8:0 "§R[CHI.GetNameDefCap] may choose to go to war over this!§!"
 USA_destroyers_for_bases_tt:0 "§Y[USA.GetNameDefCap]§!: \n"
 SWI_add_forts_bordering:0 "[ROOT.GetNameDefCap] gains §H2 Land Forts§! in every neighboring province.\n\n"
 tfv_canada.63.t:0 "[CAN.GetNameDefCap] Offers Concessions for Newfoundland"
 PER_anti_gulf_decisions_cat_des:0 "[PER.GetNameDefCap] is attempting to undermine the interests of anyone who would oppose them in the Gulf region. We must act decisively before their underhanded tactics tip the delicate balance of power too far in their favor."
 AFG_industrial_events.15.desc:0 "[FROM.GetNameDefCap] government has uttered harsh rhetoric regarding our nationalization of the oil industry. However, there is no sign that they intend to take the matter further."
 AFG_political_events.71.desc:0 "Against all odds, [FROM.GetNameDef] has conceded to our demands for renegotiating the Durand Line. Under immense pressure and unwilling to risk a prolonged conflict in the region, the [FROM.GetAdjective] have agreed to redraw the borders, acknowledging our rightful claim to the Pashtun lands. This diplomatic victory not only unites our people but also strengthens the legitimacy of [ROOT.GetLeader]’s rule. [ROOT.GetNameDefCap] stands more united and stronger than ever."
 AFG_political_events.72.t:0 "[FROM.GetNameDefCap] Proposes Territorial Concession"
 IRQ_political_events.11.t:0 "[FROM.GetNameDefCap] Issues Diplomatic Protest"
 IRQ_political_events.30.t:0 "[FROM.GetNameDefCap] Demands Control of [553.GetName]"
 IRQ_political_events.43.desc:0 "[FROM.GetNameDefCap] has agreed to our proposal to transfer Syria to our authority, marking a significant step toward the unification of the Arab world. This historic agreement strengthens our position as a leader in the region and brings us closer to realizing the vision of a united and prosperous Arab nation."
 IRQ_political_events.53.desc:0 "[FROM.GetNameDefCap] has agreed to our proposal to transfer Kuwait to our authority, marking a significant step toward the unification of the Arab world. This historic agreement strengthens our position as a leader in the region and brings us closer to realizing the vision of a united and prosperous Arab nation."
 RAJ_conquerors_of_persia_desc:0 "[PER.GetNameDefCap], a land of immense wealth and history, once stood as a rival to the empire. By bringing it under Mughal rule, we reaffirm our dominance, secure vital western territories, and solidify the empire’s place as the true inheritor of imperial grandeur."
 RAJ_the_true_mongols_desc:0 "[Root.GetNameDefCap] is the rightful inheritor of the Mongol legacy, blending the strength of the steppes with the culture of the subcontinent. By embracing our roots, we channel the spirit of the True Mongols to conquer and unify as our ancestors once did."
 RAJ_preemptive_invasion_of_iran_desc:0 "[PER.GetNameDefCap] borders us to the west, and if not dealt with swiftly, they could provide our enemies with a straight path to [RAJ.GetNameDef] through the Persian Corridor. Such an invasion could certainly draw the ire from those who strive for peace, but if we are successful, then [PER.GetNameDef]'s rich oil fields will be ours for the taking."
 RAJ_defense_of_malaya_desc:0 "[MAL.GetNameDefCap] could be at risk of invasion given its position between the Indian Ocean and the Pacific. As a fellow crown jewel, we must do our part to help defend and fortify the region. We must maintain control of South East Asia."
 PER_plant_resistance_cells_desc:0 "In order to prepare for our pre-emptive strike, we would be wise to stir up political unrest in our neighboring regions. [IRQ.GetNameDefCap] seems like an excellent choice, as well as the occupied regions of [AZR.GetNameDef], [GEO.GetNameDef], [ARM.GetNameDef], [TMS.GetNameDef]."
 IRQ_align_afghanistan_fasc_desc:0 "[AFG.GetNameDefCap] has long been trapped between the [SOU.GetAdjective]s and [ENG.GetAdjective] as a buffer state. Perhaps by working together, we can elevate them to a more fitting position in the region."
 POR_arms_purchases_desc:0 "[Root.GetNameDefCap]'s military industry and naval facilities are not currently able to produce the equipment our forces need. Therefore, we must seek to arrange deals with foreign powers that can provide us with modern weapons and ships."
 LaR_Britain_Stresa_agreed:0 "[FRA.GetNameDefCap], [ENG.GetNameDef] and [ITA.GetNAmeDef]"
 LaR_Britain_Stresa_refused:0 "[FRA.GetNameDefCap] and [ITA.GetNAmeDef]"
 mexico.3.desc:0 "In response to our nationalization of their oil concessions, [From.GetLeader] has decided to accept the demands of the oil companies and has placed an embargo on our country. [From.GetNameDefCap] will no longer buy or sell resources with us. We should consider either compensating the oil firms, or abandoning the international status quo and seeking our fortunes with the enemies of liberal capitalism."
 mexico.13.a:0 "[From.GetNameDefCap] is truly our friend."
 mexico.55.title:0 "[From.GetNameDefCap] Backed off the Caribbean!"
 mexico.56.title:0 "[From.GetNameDefCap] Refuses our Demands"
 mtg_britain.75.d:0 "[RAJ.GetNameDefCap] has resigned itself to accepting our independence. In the face of plummeting domestic support, they feel there is no further point in continuing this gruelling war."
 mtg_britain.78.d:0 "[PAK.GetNameDefCap] has resigned itself to accepting our independence. In the face of plummeting domestic support, they feel there is no further point in continuing this gruelling war."
 panay_incident.2.d:0 "The gunboat USS Panay came under fire earlier today while evacuating civilians from the front line in the war between [JAP.GetName] and [CHI.GetName], despite being clearly marked with [USA.GetAdjective] flags. Struck with two bombs, she sank later that day with three US citizens killed and many more wounded. Survivors were picked up by [USA.GetAdjective] and [ENG.GetAdjective] gunboats in the area.\n\n[JAP.GetNameDefCap] has been quick to claim it was an accident and offer an apology, but some think that the attack was deliberate and a number of advisors are calling for war. However, public support for war remains low and any declaration is likely to be deeply divisive. How should we respond?"
 panay_incident.2.e:0 "The gunboat USS Panay came under fire earlier today while evacuating civilians from the front line in the war between [JAP.GetName] and [CHI.GetName], despite being clearly marked with [USA.GetAdjective] flags. Struck with two bombs, she sank later that day with three US citizens killed and many more wounded. Survivors were picked up by [USA.GetAdjective] and [ENG.GetAdjective] gunboats in the area.\n\n[JAP.GetNameDefCap] has been quick to claim it was an accident and offer an apology, but some think that the attack was deliberate and a number of advisors are calling for war. How should we respond?"
 mtg_netherlands.60.t:0 "[From.GetNameDefCap] Escalate Diplomatic Row"
 mtg_netherlands.61.t:0 "[From.GetNameDefCap] Escalates Row Further"
 mtg_netherlands.61.d:0 "[From.GetNameDefCap] has not backed down, and refuses to issue an apology for the insulting accusations and slander aimed at Prince Bernhard. Whether they are correct and the Prince has interfered in domestic issues or not is besides the point - we now have reached the breaking point in international relations."
 mtg_netherlands.62.t:0 "[From.GetNameDefCap] Soothes Tensions"
 mtg_netherlands.77.t:0 "[From.GetNameDefCap] Proposes Federation"
 mtg_netherlands.78.t:0 "[From.GetNameDefCap] Accepts Federation"
 mtg_netherlands.79.t:0 "[From.GetNameDefCap] Rejects Federation"
 MUN_czech.1006.d:0 "[FROM.GetNameDefCap] has approached us with a mutual defense treaty, seeking to dissuade any attackers with the combined might of our armies. Interestingly however, there is also a secret part of the treaty, where potential expansion of [ROOT.GetAdjective] influence is laid out, and how [FROM.GetNameDef] could assist."
 MUN_czech.1017.d:0 "[FROM.GetNameDefCap] has approached the top of the [ROOT.GetAdjective] with secret plans to invade [GER.GetNameDef]. After showing how committed they are to eliminating the [GER.GetAdjective] threat, they requested that we would assist, to together overwhelm the mighty [GER.GetAdjective] army."
 LIT_events.601.t:0 "[From.GetNameDefCap] Joins the League"
 NSB_poland_communist_events.502.t:0 "[From.GetNameDefCap] Accepts [Root.GetAdjective] Independence"
 NSB_soviet_foreign_politics_events.13.t:0 "[FROM.GetNameDefCap] Rejects [ROOT.GetAdjective] Guidelines"
 NSB_soviet_foreign_politics_events.264.t:0 "[FROM.GetNameDefCap] Complies with our Peace Terms"
 NSB_soviet_foreign_politics_events.265.t:0 "[FROM.GetNameDefCap] Rejects our Peace Terms"
 NSB_soviet_foreign_politics_events.265.desc:0 "[From.GetNameDefCap] has rejected our offer of peace, vowing to continue fighting until [ROOT.GetAdjective] occupation of [FROM.GetAdjective] territories is eliminated and the war is brought back to our territory."
 NSB_soviet_foreign_politics_events.267.t:0 "[FROM.GetNameDefCap] Rejects our Proposal for a Defensive Pact"
 NSB_soviet_foreign_politics_events.269.t:0 "[FROM.GetNameDefCap] Rejects our Proposal for an Offensive Pact"
 NSB_soviet_nationalist.003.desc:0 "[FROM.GetLeader] saw no reason not to accept our rightful demands. [FROM.GetNameDefCap] will return to the Empire, with some right to self government."
 NSB_soviet_fascist_tsarist.4.t:0 "[FROM.GetNameDefCap] Influences our Politics"
 NSB_soviet_fascist_tsarist.6.t:0 "[FROM.GetNameDefCap] Joins [ROOT.GetFactionName]"
 NSB_soviet_fascist_tsarist.6.desc:0 "[FROM.GetNameDefCap] has accepted our alliance offer, and has forthwith joined our faction!"
 NSB_soviet_fascist_tsarist.7.t:0 "[FROM.GetNameDefCap] Rejects Invitation"
 NSB_soviet_fascist_tsarist.9.desc:0 "[FROM.GetNameDefCap] has finally become a fascist power. Accordingly, they have been offered, and have accepted, membership in our alliance."
 NSB_soviet_fascist_tsarist.10.desc:0 "[FROM.GetNameDefCap] has finally become a fascist power. However, despite all our aid in bringing their fascist party to power, and offering them membership in our alliance, they have rejected our invitation and elected to stand alone."
 NSB_soviet_fascist_tsarist.18.desc:0 "[FROM.GetNameDefCap] has informed us that they do not see any benefit in an alliance with us at this time."
 poland.1502.a:0 "[Root.GetNameDefCap] and [From.GetNameDef] will be one!"
 poland.21.t:0 "[DNZ.GetNameDefCap] Seeks Integration with [Ger.GetNameDefCap]"
 tfv_australia.21.d:0 "The [From.GetAdjective] has folded to our ultimatum, and accepts their new status as a province of [Root.GetNameDef]. While [From.GetAdjective] PM [From.GetLeader] mourns the loss of [From.GetAdjective] "independence," this moment marks the beginning of a new era for Oceania.\n\n[From.GetNameDefCap], like us, are now done being the lapdogs of an Empire that does not have our interests at heart."
 tfv_south_africa.31.t:0 "[From.GetNameDefCap] Yields"
 CHL_political_events.37.t:0 "[FROM.GetNameDefCap] refuses to join the Hispanic Alliance"
